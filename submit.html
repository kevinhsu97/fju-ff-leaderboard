<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登錄我的成績</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
:root{--y:#fabe05;--k:#111;--bg:#f6f4ee;--card:#fff;--line:#e2ddd0;--mute:#6f6a5e;--err:#c62828;--ok:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--k);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:0 16px 48px;-webkit-font-smoothing:antialiased}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto}
header{background:var(--k);color:#fff;margin:0 -16px 20px;padding:18px 16px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:22px;font-weight:900}
header h1 span{color:var(--y)}
header a{color:var(--y);font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:12px;background:var(--k);color:var(--y);padding:2px 8px;border-radius:4px}
h2 .tag.p{background:#fde7e7;color:var(--err)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
label small{color:var(--mute);font-weight:500}
input[type=text],input[type=tel],input[type=number],input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:1px;border-color:var(--k)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;border:2px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:17px;font-weight:900;cursor:pointer;background:#fff}
.seg input:checked + label{background:var(--y);border-color:var(--k)}
.seg input:focus-visible + label{outline:3px solid var(--k)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;justify-content:space-between;background:var(--k);color:#fff;border-radius:12px;padding:14px 18px;margin-top:16px}
.preview .s{font-size:44px;font-weight:800;color:var(--y);line-height:1}
.preview .t{font-size:13px;color:#bbb;font-weight:700}
.preview .lv{font-weight:900;font-size:16px;text-align:right}
.photo{display:flex;gap:12px;align-items:center;margin-top:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{margin:0!important;display:flex!important;align-items:center;justify-content:center;gap:8px;min-height:54px;border:2px solid var(--k);border-radius:12px;background:var(--y);font-size:17px!important;font-weight:900!important;cursor:pointer}
.pbtn.alt{background:#fff}
.pbtn span{font-size:20px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
input.vh:focus-visible + .pbtn{outline:3px solid var(--k)}
input[type=file]{font:inherit;font-size:14px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:900;font-size:15px;border:2px solid var(--k);background:var(--y);color:var(--k);border-radius:10px;padding:10px 14px;margin-right:10px;cursor:pointer}
.photo img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:2px solid var(--line);background:#eee}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:900;font-size:15px;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.primary{width:100%;background:var(--k);color:var(--y);font-size:19px;padding:16px;margin-top:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;font-weight:500;line-height:1.5}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--k)}
.msg{margin-top:12px;font-weight:700;font-size:15px;min-height:1.4em}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.recent{list-style:none;display:grid;gap:8px}
.recent li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.recent li.hid{opacity:.45;text-decoration:line-through}
.recent b{font-size:15px}.recent span{color:var(--mute);font-size:13px}
.recent .sc{font-size:26px;font-weight:800}
.recent .btn{padding:6px 10px;font-size:13px}
.hint{color:var(--mute);font-size:13px;line-height:1.6;margin:-4px 0 4px}
.intro{font-size:15px;line-height:1.6;margin-bottom:14px}
.btn.ghost{width:100%;margin-top:10px;padding:14px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><h1>登錄 <span>我的成績</span></h1><a href="index.html">看排行榜 →</a></div></header>
<main class="wrap">

  <form id="form" novalidate>
    <p class="intro">划完 20 秒後，拍下<b>電子錶的公尺數</b>，填好資料就能登上排行榜！雙人 PK 的話兩個人都各自上傳自己的成績。人多的話可以先拍照，晚點再來填。</p>
    <section class="card">
      <h2>排行榜顯示 <span class="tag">公開</span></h2>
      <label for="nickname">暱稱</label>
      <input type="text" id="nickname" maxlength="12" required placeholder="排行榜上顯示的名字">
      <label for="dept">系級班級 <small>（選填，非輔大生可空白）</small></label>
      <input type="text" id="dept" maxlength="16" placeholder="例：資工系 2B">
      <label>性別 <small>（領獎門檻男女不同）</small></label>
      <div class="seg">
        <input type="radio" name="sex" id="s-m" value="m" checked><label for="s-m">男生</label>
        <input type="radio" name="sex" id="s-f" value="f"><label for="s-f">女生</label>
      </div>
      <label for="meters">划船機 20 秒成績（公尺）<small>（照電子錶上的數字）</small></label>
      <input type="text" id="meters" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" maxlength="6" autocomplete="off" required placeholder="例：142">
      <div class="preview">
        <div><div class="t">你的成績</div><div class="s num" id="pScore">0<small style="font-size:22px">M</small></div></div>
        <div class="lv"><div class="t">獎勵</div><div id="pLevel">—</div></div>
      </div>
    </section>

    <section class="card">
      <h2>寄獎聯絡資料 <span class="tag p">不公開</span></h2>
      <p class="hint">拿到名次時用來聯絡你、寄送獎品，只有主辦單位看得到。</p>
      <div class="row2">
        <div><label for="realname">本名</label><input type="text" id="realname" maxlength="20" required autocomplete="off"></div>
        <div><label for="phone">手機</label><input type="tel" id="phone" maxlength="10" inputmode="numeric" required placeholder="09xxxxxxxx" autocomplete="off"></div>
      </div>
      <label>電子錶照片 <small>（必填，請拍清楚公尺數）</small></label>
      <div class="pick">
        <label class="pbtn" for="photoCam"><span aria-hidden="true">📷</span>拍照</label>
        <label class="pbtn alt" for="photoLib"><span aria-hidden="true">🖼️</span>從相簿選</label>
        <input type="file" id="photoCam" accept="image/*" capture="environment" class="vh">
        <input type="file" id="photoLib" accept="image/*" class="vh">
      </div>
      <p class="hint" style="margin-top:8px">排隊人多時，可以先用手機相機拍下電子錶，之後再到這裡「從相簿選」上傳。</p>
      <div class="photo">
        <img id="photoPrev" alt="電子錶照片預覽" hidden>
        <button type="button" class="btn" id="photoClear" hidden>換一張</button>
      </div>
      <label class="check"><input type="checkbox" id="consent">
        <span>我同意提供本名、手機與照片，<strong>僅用於本活動核對成績與寄送獎品</strong>，不會公開，活動結束後刪除。</span></label>
    </section>

    <button class="btn primary" id="submitBtn" type="submit">送出成績</button>
    <p class="msg" id="msg" role="status"></p>
    <a class="btn ghost" href="index.html" id="toBoard" hidden>看我的名次 →</a>
  </form>
</main>

<script src="config.js"></script>
<script>
(function(){
  const C = window.LEADERBOARD_CONFIG || {};
  const TH = C.THRESHOLD || {m:{b:110,a:150}, f:{b:90,a:120}};
  const MAX = 300; // 20 秒內合理上限，超過視為輸入錯誤
  const $ = id => document.getElementById(id);
  let photoData = null;
  const sex = () => document.querySelector('input[name=sex]:checked').value;
  const scoreOf = () => Math.round(parseFloat($("meters").value)||0);
  const levelOf = (m, x) => { const t = TH[x==="f"?"f":"m"];
    return m>=t.a ? "A 獎區任選" : m>=t.b ? "B 獎區任選" : m>0 ? "參加獎" : "—"; };
  try{ const saved = JSON.parse(localStorage.getItem("me")||"{}"); ["nickname","dept","realname","phone"].forEach(k => { if(saved[k]) $(k).value = saved[k]; }); }catch(e){}

  function updatePreview(){ const s = scoreOf(); $("pScore").innerHTML = s + '<small style="font-size:22px">M</small>'; $("pLevel").textContent = levelOf(s, sex()); }
  $("meters").addEventListener("input", e => { const v = e.target.value.replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1"); if(v !== e.target.value) e.target.value = v; updatePreview(); });
  document.querySelectorAll('input[name=sex]').forEach(r => r.addEventListener("change", updatePreview));

  async function onPick(e){
    const f = e.target.files[0]; if(!f) return; photoData = null; $("photoPrev").hidden = true; $("photoClear").hidden = true;
    if(!f) return;
    try{
      const img = await createImageBitmap(f);
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      photoData = cv.toDataURL("image/jpeg", 0.8);
      $("photoPrev").src = photoData; $("photoPrev").hidden = false; $("photoClear").hidden = false; e.target.value = "";
    }catch(err){ $("msg").className = "msg err"; $("msg").textContent = "照片讀取失敗，請改用 JPG 或重新拍攝"; }
  }
  $("photoCam").addEventListener("change", onPick);
  $("photoLib").addEventListener("change", onPick);
  $("photoClear").addEventListener("click", () => { photoData = null; $("photoPrev").hidden = true; $("photoClear").hidden = true; });

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("msg"); msg.className = "msg err";
    const x = sex();
    const nickname = $("nickname").value.trim(), meters = parseFloat($("meters").value.replace(/[^0-9.]/g,""));
    const realname = $("realname").value.trim(), phone = $("phone").value.replace(/\D/g,"");
    if(!nickname) return msg.textContent = "請填暱稱";
    if(!(meters > 0)) return msg.textContent = "請填公尺數";
    if(meters > MAX) return msg.textContent = `公尺數好像太高了，請再確認電子錶（上限 ${MAX}M）`;
    if(!realname) return msg.textContent = "請填本名";
    if(!/^09\d{8}$/.test(phone)) return msg.textContent = "手機格式應為 09 開頭共 10 碼";
    if(!photoData) return msg.textContent = "請上傳電子錶照片";
    if(!$("consent").checked) return msg.textContent = "請勾選同意提供資料";
    if(!C.API_URL) return msg.textContent = "網站尚未設定完成（config.js 的 API_URL）";
    $("submitBtn").disabled = true; msg.className = "msg"; msg.textContent = "上傳中，請稍候…";
    try{
      const res = await fetch(C.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({action:"submit", nickname, dept:$("dept").value.trim(), sex:x, meters, realname, phone, photo:photoData})});
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || "送出失敗");
      try{ localStorage.setItem("me", JSON.stringify({nickname, dept:$("dept").value.trim(), realname, phone})); localStorage.setItem("lb-find", nickname); }catch(e){}
      msg.className = "msg ok"; msg.textContent = `送出成功！${nickname} ${data.score}M（${levelOf(data.score, x)}）`;
      $("meters").value = ""; photoData = null; $("photoPrev").hidden = true; $("photoClear").hidden = true; $("consent").checked = false; updatePreview();
      $("toBoard").hidden = false;
    }catch(err){ msg.className = "msg err"; msg.textContent = err.message; }
    finally{ $("submitBtn").disabled = false; }
  });
})();
</script>
</body>
</html>

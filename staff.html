<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>排行榜管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
:root{--y:#fabe05;--k:#111;--bg:#f6f4ee;--card:#fff;--line:#e2ddd0;--mute:#6f6a5e;--err:#c62828;--ok:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--k);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:0 16px 48px;-webkit-font-smoothing:antialiased}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto}
header{background:var(--k);color:#fff;margin:0 -16px 20px;padding:18px 16px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:22px;font-weight:900}
header h1 span{color:var(--y)}
header a{color:var(--y);font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:12px;background:var(--k);color:var(--y);padding:2px 8px;border-radius:4px}
h2 .tag.p{background:#fde7e7;color:var(--err)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
label small{color:var(--mute);font-weight:500}
input[type=text],input[type=tel],input[type=number],input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:1px;border-color:var(--k)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;border:2px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:17px;font-weight:900;cursor:pointer;background:#fff}
.seg input:checked + label{background:var(--y);border-color:var(--k)}
.seg input:focus-visible + label{outline:3px solid var(--k)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;align-items:center;justify-content:space-between;background:var(--k);color:#fff;border-radius:12px;padding:14px 18px;margin-top:16px}
.preview .s{font-size:44px;font-weight:800;color:var(--y);line-height:1}
.preview .t{font-size:13px;color:#bbb;font-weight:700}
.preview .lv{font-weight:900;font-size:16px;text-align:right}
.photo{display:flex;gap:12px;align-items:center}
input[type=file]{font:inherit;font-size:14px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:900;font-size:15px;border:2px solid var(--k);background:var(--y);color:var(--k);border-radius:10px;padding:10px 14px;margin-right:10px;cursor:pointer}
.photo img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:2px solid var(--line);background:#eee}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--k);background:#fff;color:var(--k);font:inherit;font-weight:900;font-size:15px;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.primary{width:100%;background:var(--k);color:var(--y);font-size:19px;padding:16px;margin-top:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;font-weight:500;line-height:1.5}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--k)}
.msg{margin-top:12px;font-weight:700;font-size:15px;min-height:1.4em}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.recent{list-style:none;display:grid;gap:8px}
.recent li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.recent li.hid{opacity:.45;text-decoration:line-through}
.recent b{font-size:15px}.recent span{color:var(--mute);font-size:13px}
.recent .sc{font-size:26px;font-weight:800}
.recent .btn{padding:6px 10px;font-size:13px}
.hint{color:var(--mute);font-size:13px;line-height:1.6}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><h1>排行榜管理 <span>工作人員</span></h1><a href="index.html" target="_blank" rel="noopener">看排行榜 ↗</a></div></header>
<main class="wrap">

  <section class="card" id="loginCard">
    <h2>輸入工作人員通行碼</h2>
    <input type="password" id="code" autocomplete="off" placeholder="通行碼">
    <button class="btn primary" id="loginBtn" type="button">進入登錄台</button>
    <p class="msg" id="loginMsg"></p>
  </section>

  <div id="form" hidden>
    <section class="card" style="margin-top:16px">
      <h2>最近登錄 <button class="btn" type="button" id="reloadBtn" style="margin-left:auto">重新整理</button></h2>
      <ul class="recent" id="recent"></ul>
      <p class="hint">點「照片」核對電子錶數字（需登入主辦 Google 帳號）。成績不符就按「隱藏」，會從排行榜拿掉，資料仍保留在試算表。</p>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script>
(function(){
  const C = window.LEADERBOARD_CONFIG || {};
  const $ = id => document.getElementById(id);
  let code = "";
  try{ code = sessionStorage.getItem("staff-code") || ""; }catch(e){}
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  async function api(payload){
    if(!C.API_URL) throw new Error("尚未設定 API_URL（config.js）");
    const res = await fetch(C.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...payload, code})});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "發生錯誤");
    return data;
  }
  async function login(){
    code = $("code").value.trim() || code;
    $("loginMsg").className = "msg"; $("loginMsg").textContent = "確認中…";
    try{
      await api({action:"ping"});
      try{ sessionStorage.setItem("staff-code", code); }catch(e){}
      $("loginCard").hidden = true; $("form").hidden = false; loadRecent();
    }catch(e){ $("loginMsg").className = "msg err"; $("loginMsg").textContent = e.message; }
  }
  $("loginBtn").addEventListener("click", login);
  $("code").addEventListener("keydown", e => { if(e.key==="Enter") login(); });
  if(code){ $("code").value = code; login(); }

  async function loadRecent(){
    try{
      const d = await api({action:"recent"});
      $("recent").innerHTML = (d.rows||[]).map(r => `
        <li class="${r.hidden?"hid":""}">
          <div><b>${esc(r.nickname)}</b> <span>${r.sex==="f"?"女":"男"} · ${esc(r.meters)}M · ${esc(r.level||"")} · ${esc(r.name)} · ${esc(r.time)}</span>
            ${r.photo?`<br><a href="${esc(r.photo)}" target="_blank" rel="noopener">照片 ↗</a>`:""}</div>
          <span class="sc num">${r.meters}<small style="font-size:15px">M</small></span>
          <button class="btn" type="button" data-id="${esc(r.id)}" data-h="${r.hidden?0:1}">${r.hidden?"恢復":"隱藏"}</button>
        </li>`).join("") || '<li><span>尚無資料</span></li>';
    }catch(e){ $("recent").innerHTML = `<li><span>${esc(e.message)}</span></li>`; }
  }
  $("reloadBtn").addEventListener("click", loadRecent);
  setInterval(() => { if(!$("form").hidden && !document.hidden) loadRecent(); }, 15000);
  $("recent").addEventListener("click", async e => {
    const b = e.target.closest("button[data-id]"); if(!b) return;
    b.disabled = true;
    try{ await api({action:"hide", id:b.dataset.id, hidden:b.dataset.h==="1"}); loadRecent(); }
    catch(err){ b.disabled = false; alert(err.message); }
  });
})();
</script>
</body>
</html>
